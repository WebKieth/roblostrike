name: Test, build and publish Roblox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tools/tests -v
      - name: Install Rojo 7.7.1
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            --output "$RUNNER_TEMP/rojo.zip"
          echo "00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  $RUNNER_TEMP/rojo.zip" | sha256sum --check
          unzip "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"
      - name: Build
        run: |
          mkdir -p build
          rojo build default.project.json -o build/robostrike.rbxl
      - uses: actions/upload-artifact@v4
        with:
          name: robostrike-${{ github.sha }}
          path: build/robostrike.rbxl
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: roblox
    concurrency:
      group: roblox-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: robostrike-${{ github.sha }}
          path: build
      - name: Publish live place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A slow older build must not overwrite a newer main revision.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated revision $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python tools/publish_roblox.py build/robostrike.rbxl
